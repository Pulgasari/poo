name:                poo
version:             0.1.0.0
github:              "pulgasari/poo"
license:             BSD-3-Clause
author:              "Pulgasari"
maintainer:          "example@example.com"
copyright:           "2026 Pulgasari"

extra-source-files:
- README.md

description:         First Haskell compiler/parser for the poo language

dependencies:
- base >= 4.7 && < 5
- megaparsec
- text
- parser-combinators

library:
  source-dirs: src
  exposed-modules:
  - Poo.AST
  - Poo.Token
  - Poo.Lexer
  - Poo.Parser

executables:
  poo-parser:
    main:                Main.hs
    source-dirs:         src
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - poo
