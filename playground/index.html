<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>playground @ poo</title>
  <link rel="stylesheet" href="./app.aufbau.css" />
  <!-- Highlight.js Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />

  <style>
    /* Styling for the synchronized editor overlay */
    .editor-wrapper {
      position: relative;
      width: 100%;
      /*height: 250px;*/
    }

    #code-input,
    .code-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      font-family: monospace, monospace;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid #444;
      border-radius: 4px;
    }

    #code-input {
      color: transparent;
      background: transparent;
      caret-color: #fff;
      z-index: 1;
      resize: none;
      outline: none;
    }

    .code-overlay {
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #code-output pre {
      margin: 0;
      padding: 12px;
      border-radius: 4px;
      font-family: monospace, monospace;
      font-size: 14px;
      line-height: 1.5;
      overflow: auto;
    }
  </style>

  <script type="importmap">
    {"imports":{
      "htm"                  : "https://esm.sh/htm@3.1.1",
      "preact"               : "https://esm.sh/preact@10.20.1",
      "preact/hooks"         : "https://esm.sh/preact@10.20.1/hooks",
      "@preact/signals"      : "https://esm.sh/@preact/signals@1.2.2?external=preact",
      
      "@aufbau/cache"        : "https://pulgasari.github.io/aufbau/cache/index.js",
      "@aufbau/import"       : "https://pulgasari.github.io/aufbau/import/index.js",
      "@aufbau/kit"          : "https://pulgasari.github.io/aufbau/kit/index.js",
      "@aufbau/shaders"      : "https://pulgasari.github.io/aufbau/shaders/index.js",
      "@aufbau/stylesheet"   : "https://pulgasari.github.io/aufbau/stylesheet/index.js",

      "@cosmonaut/blocks"      : "https://pulgasari.github.io/cosmonaut/packages/parser/blocks/index.js",
      "@cosmonaut/doc"         : "https://pulgasari.github.io/cosmonaut/packages/generator/doc/index.js",     
      "@cosmonaut/doc-printer" : "https://pulgasari.github.io/cosmonaut/packages/generator/doc-printer/index.js",   
      "@cosmonaut/generator"   : "https://pulgasari.github.io/cosmonaut/packages/generator/index.js",     
      "@cosmonaut/internals"   : "https://pulgasari.github.io/cosmonaut/packages/internals/index.js",
      "@cosmonaut/lexer"       : "https://pulgasari.github.io/cosmonaut/packages/lexer/index.js",
      "@cosmonaut/lsd"         : "https://pulgasari.github.io/cosmonaut/packages/lsd/index.js",
      "@cosmonaut/parser"      : "https://pulgasari.github.io/cosmonaut/packages/parser/index.js",
      "@cosmonaut/presets"     : "https://pulgasari.github.io/cosmonaut/packages/presets/index.js",
      "@cosmonaut/utils"       : "https://pulgasari.github.io/cosmonaut/packages/utils/index.js",
      "@cosmonaut/utils/internals" : "https://pulgasari.github.io/cosmonaut/packages/utils/internals.js",

      "@poo/compiler"        : "https://pulgasari.github.io/poo/js-packages/compiler/index.js"
    }}
  </script>
</head>

<body class="mobilefix">
  
  <div id='app'>
    <div id='app-header'>header</div>
    <div id='app-body'></div>
    <div id='app-footer'>footer</div>
  </div>

  <script type="module">
    import aufbau, { html, useRef, useSignal, useSignalEffect } from '@aufbau/kit';
    import compilePOO from '@poo/compiler';

    // Import Highlight.js and POO language support
    import hljs        from 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/+esm';
    import registerPoo from 'https://pulgasari.github.io/poo/js-packages/hljs/index.js';

    // Register POO custom syntax
    hljs.registerLanguage('poo', registerPoo);

    function transformCode (code) {
      try       { return compilePOO(code).code; } 
      catch (e) { return '// Compilation error:\n' + e.message; }
    }

    function Main () {
      const input  = useSignal("str = 'coding sucks';");
      const output = useSignal('');
      const preOverlayRef = useRef(null);

      useSignalEffect(() => {
        const currentInput = input.value;
        const timer = setTimeout(() => { 
          output.value = transformCode(currentInput); 
        }, 300);

        return () => clearTimeout(timer);
      });

      // Synchronize scrolling between the transparent textarea and the code overlay
      const handleScroll = (e) => {
        if (preOverlayRef.current) {
          preOverlayRef.current.scrollTop  = e.target.scrollTop;
          preOverlayRef.current.scrollLeft = e.target.scrollLeft;
        }
      };

      // Generate highlighted HTML strings using Highlight.js
      const highlightedInput  = hljs.highlight(input.value || '', { language: 'poo' }).value;
      const highlightedOutput = output.value ? hljs.highlight(output.value, { language: 'javascript' }).value : '';

      return html`
        <div id='playground'>
          <!-- Input code editor container with visual overlay -->
          <div class='editor-wrapper'>
            <textarea
              id='code-input'
              placeholder='enter poo code ...'
              value=${input}
              onInput=${(e) => (input.value = e.target.value)}
              onScroll=${handleScroll}
              spellcheck="false"
            ></textarea>
            <pre ref=${preOverlayRef} class='code-overlay hljs'><code dangerouslySetInnerHTML=${{ __html: highlightedInput + '\n' }}></code></pre>
          </div>

          <!-- JavaScript highlighted output container -->
          <div id='code-output'>
            <pre class='hljs'><code dangerouslySetInnerHTML=${{ __html: highlightedOutput }}></code></pre>
          </div>
        </div>
      `;
    }
    
    const $appBody = document.getElementById('app-body');
    aufbau.render(html`<${Main} />`, $appBody);
  </script>

</body>
</html>
