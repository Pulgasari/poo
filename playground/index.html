<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>playground @ poo</title>
  <link rel="stylesheet" href="./app.aufbau.css" />
  <script type="importmap">
    {"imports":{
      "htm"                  : "https://esm.sh/htm@3.1.1",
      "preact"               : "https://esm.sh/preact@10.20.1",
      "preact/hooks"         : "https://esm.sh/preact@10.20.1/hooks",
      "@preact/signals"      : "https://esm.sh/@preact/signals@1.2.2?external=preact",
      
      "@aufbau/cache"        : "https://pulgasari.github.io/aufbau/cache/index.js",
      "@aufbau/import"       : "https://pulgasari.github.io/aufbau/import/index.js",
      "@aufbau/kit"          : "https://pulgasari.github.io/aufbau/kit/index.js",
      "@aufbau/shaders"      : "https://pulgasari.github.io/aufbau/shaders/index.js",
      "@aufbau/stylesheet"   : "https://pulgasari.github.io/aufbau/stylesheet/index.js",

      "@cosmonaut/doc"       : "https://pulgasari.github.io/cosmonaut/packages/generator/doc/index.js",     
      "@cosmonaut/generator" : "https://pulgasari.github.io/cosmonaut/packages/generator/index.js",     
      "@cosmonaut/layouter"  : "https://pulgasari.github.io/cosmonaut/packages/generator/layouter/index.js",
      "@cosmonaut/lexer"     : "https://pulgasari.github.io/cosmonaut/packages/lexer/index.js",
      "@cosmonaut/lsd"       : "https://pulgasari.github.io/cosmonaut/packages/lsd/index.js",
      "@cosmonaut/parser"    : "https://pulgasari.github.io/cosmonaut/packages/parser/index.js",
      "@cosmonaut/utils"     : "https://pulgasari.github.io/cosmonaut/packages/utils/index.js"
    }}
  </script>
</head>

<body class="mobilefix">
  
  <div id='app'>
    <div id='app-header'>header</div>
    <div id='app-body'></div>
    <div id='app-footer'>footer</div>
  </div>

  <script type="module">
    //alert('playground start');
    import aufbau, { html } from '@aufbau/kit';
    const { define, update, signal, effect, useSignal, useSignalEffect } = aufbau;

    function transformCode (code) {
      return code;
    }
    //define({ key: 'bg', type: 'property' });
    //define({ key: 'fg', type: 'property' });
    //alert('playground mitte');

    function Main () {
      const  input = useSignal('');
      const output = useSignal('');

      useSignalEffect(() => {
        // Accessing input.value automatically subscribes this effect to changes
        const currentInput = input.value;
        const timer = setTimeout(() => {
          output.value = transformCode(currentInput);
        }, 500);

        // Clean up pending execution when input changes before timeout completes
        return () => clearTimeout(timer);
      });

      return html`
        <div id='playground'>
          <textarea
            id='code-input'
            placeholder='enter poo code ...'
            value=${input}
            onInput=${(e) => (input.value = e.target.value)}
          ></textarea>
          <div id='code-output'>${output}</div>
          <div id='console'>output</div>
        </div>
      `;
    }
    
    const $appBody = document.getElementById('app-body');
    aufbau.render(html`<${Main} />`, $appBody);
    //alert('playground end');
  </script>

</body>
</html>
